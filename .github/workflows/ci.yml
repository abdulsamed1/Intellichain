name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    name: Contract — format, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - name: Checkout (with pinned git submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry (pinned)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build

      # Unit suites are offline: no RPC endpoint, no secrets needed
      - name: Unit tests
        run: forge test -vvv

      - name: Gas report
        run: forge test --gas-report
