[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_remappings = true
optimizer = true
optimizer_runs = 20000
solc_version = "0.8.20"

# Cache settings
cache = true
cache_path = 'cache'

# Test specific settings: skip fork/integration suites in plain `forge test`
# (they are allowed to require a live RPC endpoint)
test = 'test'
no_match_test = "Fork|Integration"

[profile.production]
via_ir = true
optimizer_runs = 1000000

[profile.coverage]
via_ir = true

# note: Foundry does not read `.env` by itself — the Makefile includes and
# exports `.env` for every target. Copy `.env.example` to `.env` to start.

# For more configuration options, see:
# https://github.com/foundry-rs/foundry/tree/master/config
